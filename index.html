<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>מסה | ערן</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#c9a227" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#15140f; --bg2:#1c1a14; --panel:#221f18;
  --gold:#c9a227; --gold-soft:#e8c76a;
  --meat:#c1666b; --carb:#d19a4a; --oil:#8fae5d; --veg:#5f9c7a;
  --text:#f2ede1; --text2:#a89f8c; --line:rgba(201,162,39,.16);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Heebo',sans-serif;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto;position:relative;}

/* ── HEADER ── */
header{padding:calc(var(--safe-t) + 16px) 18px 14px;background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:1px solid var(--line);flex-shrink:0;}
.h-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.h-title{font-size:19px;font-weight:800;letter-spacing:.3px;}
.h-title span{color:var(--gold-soft);}
.h-date{font-size:12px;color:var(--text2);}

/* ── TABS ── */
#tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0;padding:0 6px;}
.tab{flex:1;padding:13px 4px 11px;text-align:center;font-size:12.5px;color:var(--text2);border:none;background:none;font-family:'Heebo',sans-serif;cursor:pointer;position:relative;font-weight:500;}
.tab.active{color:var(--gold-soft);font-weight:700;}
.tab.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--gold);border-radius:2px;}

/* ── VIEWS ── */
.view{display:none;flex:1;overflow-y:auto;padding:16px 16px calc(var(--safe-b) + 16px);}
.view.active{display:block;}
.view::-webkit-scrollbar{width:3px;}
.view::-webkit-scrollbar-thumb{background:rgba(201,162,39,.25);border-radius:4px;}

/* ── CARD ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
.card h3{font-size:13px;color:var(--text2);margin-bottom:12px;font-weight:600;letter-spacing:.2px;}

/* ── DATE NAV ── */
.date-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.date-nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:17px;cursor:pointer;flex-shrink:0;}
.date-nav .lbl{flex:1;text-align:center;font-size:14.5px;font-weight:700;}
.date-nav .lbl small{display:block;font-size:11px;color:var(--text2);font-weight:400;margin-top:1px;}
.today-btn{padding:7px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(201,162,39,.1);color:var(--gold-soft);font-size:11.5px;cursor:pointer;font-family:'Heebo',sans-serif;flex-shrink:0;}

/* ── METHOD SWITCH ── */
.method-switch{display:flex;background:var(--bg2);border-radius:12px;padding:3px;margin-bottom:12px;border:1px solid var(--line);}
.method-btn{flex:1;padding:9px 4px;text-align:center;border:none;background:none;color:var(--text2);font-size:12.5px;border-radius:9px;cursor:pointer;font-family:'Heebo',sans-serif;font-weight:600;transition:all .2s;}
.method-btn.active{background:var(--gold);color:#1a1710;}

/* ── MODE SWITCH (planned/actual) ── */
.mode-switch{display:flex;gap:8px;margin-bottom:14px;}
.mode-btn{flex:1;padding:10px 4px;text-align:center;border:1.5px solid var(--line);background:var(--panel);color:var(--text2);font-size:13px;border-radius:12px;cursor:pointer;font-family:'Heebo',sans-serif;font-weight:700;transition:all .2s;}
.mode-btn.active{border-color:var(--gold);background:rgba(201,162,39,.12);color:var(--gold-soft);}

/* ── MEAL TABS ── */
.meal-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none;}
.meal-tabs::-webkit-scrollbar{display:none;}
.meal-tab{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--text2);font-size:12.5px;cursor:pointer;font-family:'Heebo',sans-serif;font-weight:600;white-space:nowrap;position:relative;}
.meal-tab.active{background:var(--gold);color:#1a1710;border-color:var(--gold);}
.meal-tab .mt-count{font-size:9px;opacity:.75;margin-right:3px;}

/* ── PROGRESS RINGS ── */
.targets-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.target-box{background:var(--bg2);border-radius:12px;padding:10px 4px;text-align:center;border:1px solid var(--line);}
.target-box .tv{font-size:17px;font-weight:800;}
.target-box .tl{font-size:10px;color:var(--text2);margin-top:1px;}
.target-box.done{border-color:rgba(143,174,93,.4);background:rgba(143,174,93,.08);}

/* ── CATEGORY SECTION ── */
.cat-section{margin-bottom:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);}
.cat-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;background:var(--panel);}
.cat-head .ch-left{display:flex;align-items:center;gap:10px;}
.cat-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.cat-name{font-size:14px;font-weight:700;}
.cat-count{font-size:12px;color:var(--text2);}
.cat-arrow{font-size:14px;color:var(--text2);transition:transform .2s;}
.cat-body{display:none;background:var(--bg2);padding:10px 12px;}
.cat-body.open{display:block;}

.food-item{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;border-bottom:1px solid rgba(255,255,255,0.04);gap:10px;}
.food-item:last-child{border-bottom:none;}
.food-name{font-size:13px;line-height:1.4;flex:1;}
.food-item .fi-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.qty-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qty-val{min-width:16px;text-align:center;font-size:13px;font-weight:700;}

/* ── SELECTED SUMMARY ── */
.selected-list{display:flex;flex-direction:column;gap:6px;}
.sel-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border-radius:10px;padding:9px 12px;}
.sel-row .sr-text{font-size:12.5px;flex:1;}
.sel-row .sr-cat{font-size:10px;color:var(--text2);margin-top:1px;}
.sel-row button{background:none;border:none;color:#c1666b;font-size:15px;cursor:pointer;padding:2px 6px;}

/* ── ACTUAL/PLANNED TEXTAREAS ── */
textarea.plain{width:100%;min-height:90px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--text);font-size:13.5px;font-family:'Heebo',sans-serif;resize:none;outline:none;direction:rtl;line-height:1.6;}
textarea.plain:focus{border-color:var(--gold);}
textarea.plain::placeholder{color:#5a5648;}

/* ── BUTTONS ── */
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:none;font-size:14.5px;font-weight:700;font-family:'Heebo',sans-serif;cursor:pointer;text-align:center;}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#1a1710;}
.btn-outline{background:none;border:1px solid var(--line);color:var(--text);}
.btn-ghost{background:var(--bg2);color:var(--text2);border:1px solid var(--line);}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{flex:1;}

/* ── FIXED MENU DISPLAY ── */
.meal-block{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--panel);}
.meal-block h4{font-size:13.5px;color:var(--gold-soft);margin-bottom:8px;font-weight:700;}
.meal-block ul{padding-right:18px;}
.meal-block li{font-size:12.5px;line-height:1.7;color:var(--text);margin-bottom:2px;}

/* ── RULES LIST ── */
.rules-list{padding-right:0;list-style:none;}
.rules-list li{font-size:12px;line-height:1.7;color:var(--text2);padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);position:relative;padding-right:20px;}
.rules-list li::before{content:'•';position:absolute;right:0;color:var(--gold);font-weight:900;}
.rules-list li:last-child{border-bottom:none;}

/* ── HISTORY LIST ── */
.hist-item{border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px;background:var(--panel);cursor:pointer;}
.hist-item .hi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.hist-item .hi-date{font-size:13px;font-weight:700;}
.hist-item .hi-badge{font-size:10.5px;padding:3px 9px;border-radius:10px;background:rgba(201,162,39,.12);color:var(--gold-soft);}
.hist-item .hi-summary{font-size:11.5px;color:var(--text2);}
.hist-item .hi-status{display:flex;gap:6px;margin-top:8px;}
.status-chip{font-size:10px;padding:3px 8px;border-radius:8px;}
.status-chip.match{background:rgba(143,174,93,.15);color:#a8cf8a;}
.status-chip.diff{background:rgba(193,102,107,.15);color:#e29ba0;}
.status-chip.pending{background:rgba(255,255,255,.06);color:var(--text2);}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:50px 20px;color:var(--text2);}
.empty .em-icon{font-size:38px;margin-bottom:10px;}
.empty .em-text{font-size:13px;line-height:1.6;}

/* ── WEIGHIN FORM ── */
.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px;}
.input-field{display:flex;flex-direction:column;gap:5px;}
.input-field label{font-size:11px;color:var(--text2);}
.input-field input{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'Heebo',sans-serif;outline:none;text-align:center;}
.input-field input:focus{border-color:var(--gold);}
.input-field.wide{grid-column:span 2;}

.big-num-input{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.big-num-input input{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--text);font-size:30px;font-weight:800;font-family:'Heebo',sans-serif;outline:none;text-align:center;}
.big-num-input .unit{font-size:15px;color:var(--text2);}

/* ── WEIGHIN HISTORY ── */
.wi-item{border:1px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden;background:var(--panel);}
.wi-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;cursor:pointer;}
.wi-date{font-size:12px;color:var(--text2);}
.wi-weight{font-size:19px;font-weight:800;color:var(--gold-soft);}
.wi-delta{font-size:11px;margin-top:2px;}
.delta-up{color:#a8cf8a;}
.delta-down{color:#e29ba0;}
.wi-body{display:none;padding:0 15px 14px;border-top:1px solid var(--line);}
.wi-body.open{display:block;}
.wi-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12.5px;}
.wi-row span:first-child{color:var(--text2);}
.wi-row span:last-child{font-weight:600;}

/* ── TOAST ── */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1710;padding:9px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;}
#toast.show{opacity:1;}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--panel);border-radius:20px 20px 0 0;padding:20px 18px calc(var(--safe-b) + 20px);width:100%;max-width:720px;max-height:80vh;overflow-y:auto;}
.modal-box h3{font-size:16px;margin-bottom:14px;text-align:center;}

.section-label{font-size:11px;color:var(--text2);margin:14px 0 8px;font-weight:600;}
.section-label:first-child{margin-top:0;}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="h-top">
      <div class="h-title">💪 <span>מסה</span> נקייה</div>
    </div>
    <div class="h-date" id="today-label"></div>
  </header>

  <nav id="tabs">
    <button class="tab active" data-view="menu">תפריט יומי</button>
    <button class="tab" data-view="history">היסטוריה</button>
    <button class="tab" data-view="weighin">שקילה</button>
    <button class="tab" data-view="measure">מדדים</button>
  </nav>

  <!-- ═══════════ MENU VIEW ═══════════ -->
  <div id="menu-view" class="view active">

    <div class="date-nav">
      <button id="menu-prev">‹</button>
      <div class="lbl" id="menu-date-lbl">היום<small id="menu-date-sub"></small></div>
      <button id="menu-next">›</button>
      <button class="today-btn" id="menu-today-btn">היום</button>
    </div>

    <div class="method-switch">
      <button class="method-btn active" data-method="portions">📊 לפי מנות</button>
      <button class="method-btn" data-method="fixed">📋 תפריט קבוע</button>
    </div>

    <!-- PLANNED / ACTUAL MODE SWITCH -->
    <div class="mode-switch" id="mode-switch">
      <button class="mode-btn active" data-mode="planned">📝 מה תכננתי</button>
      <button class="mode-btn" data-mode="actual">✅ מה אכלתי בפועל</button>
    </div>

    <!-- PORTIONS METHOD -->
    <div id="portions-panel">
      <!-- MEAL TIME TABS -->
      <div class="meal-tabs" id="meal-tabs"></div>

      <div class="targets-row" id="targets-row"></div>
      <div id="categories-container"></div>
    </div>

    <!-- FIXED METHOD -->
    <div id="fixed-panel" style="display:none">
      <div class="card" style="background:rgba(201,162,39,.06);border-color:rgba(201,162,39,.25)">
        <p style="font-size:12px;color:var(--text2);line-height:1.6">התפריט הקבוע של קארין — ניתן לחבר, לחלק או להחליף בין הארוחות לפי העדפה</p>
      </div>
      <div id="fixed-menu-container"></div>
    </div>

    <div class="card" id="day-summary-card">
      <h3 id="day-summary-title">📋 סיכום היום — מתוכנן</h3>
      <div id="day-summary-body"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-gold" id="save-day-btn">💾 שמור יום</button>
      <button class="btn btn-ghost" id="clear-day-btn">🗑 נקה ארוחה זו</button>
    </div>
  </div>

  <!-- ═══════════ HISTORY VIEW ═══════════ -->
  <div id="history-view" class="view">
    <div class="card">
      <h3>📆 כל הימים</h3>
      <div id="history-list"></div>
    </div>
  </div>

  <!-- ═══════════ WEIGHIN VIEW ═══════════ -->
  <div id="weighin-view" class="view">
    <div class="card">
      <h3>⚖️ שקילה חדשה</h3>
      <div class="big-num-input">
        <input type="number" step="0.1" id="wi-weight" placeholder="0.0" inputmode="decimal" />
        <span class="unit">ק"ג</span>
      </div>
      <div class="input-grid">
        <div class="input-field"><label>% שומן</label><input type="number" step="0.1" id="wi-fat" inputmode="decimal" /></div>
        <div class="input-field"><label>% שריר / מסת שריר</label><input type="number" step="0.1" id="wi-muscle" inputmode="decimal" /></div>
        <div class="input-field"><label>BMI</label><input type="number" step="0.1" id="wi-bmi" inputmode="decimal" /></div>
        <div class="input-field"><label>BMR (קק"ל)</label><input type="number" id="wi-bmr" inputmode="numeric" /></div>
        <div class="input-field"><label>שומן קרביים</label><input type="number" step="0.1" id="wi-visceral" inputmode="decimal" /></div>
        <div class="input-field"><label>% מים בגוף</label><input type="number" step="0.1" id="wi-water" inputmode="decimal" /></div>
      </div>
      <button class="btn btn-gold" id="wi-save-btn" style="margin-top:6px">💾 שמור שקילה</button>
    </div>

    <div class="card">
      <h3>📈 היסטוריית שקילות</h3>
      <div id="weighin-history"></div>
    </div>
  </div>

  <!-- ═══════════ MEASUREMENTS VIEW ═══════════ -->
  <div id="measure-view" class="view">
    <div class="card" style="background:rgba(201,162,39,.06);border-color:rgba(201,162,39,.25)">
      <p style="font-size:12px;color:var(--text2);line-height:1.6">מדידות מפגישות עם קארין — פעם בחודש</p>
    </div>

    <div class="card">
      <h3>📏 מדידה חדשה</h3>
      <div class="input-grid">
        <div class="input-field wide"><label>תאריך פגישה</label><input type="date" id="me-date" /></div>
        <div class="input-field"><label>משקל (ק"ג)</label><input type="number" step="0.1" id="me-weight" inputmode="decimal" /></div>
        <div class="input-field"><label>היקף חזה/יד (ס"מ)</label><input type="number" step="0.1" id="me-chest" inputmode="decimal" /></div>
        <div class="input-field"><label>היקף טבור (ס"מ)</label><input type="number" step="0.1" id="me-navel" inputmode="decimal" /></div>
        <div class="input-field"><label>היקף יד (ס"מ)</label><input type="number" step="0.1" id="me-arm" inputmode="decimal" /></div>
        <div class="input-field"><label>היקף מותניים (ס"מ)</label><input type="number" step="0.1" id="me-waist" inputmode="decimal" /></div>
        <div class="input-field"><label>היקף ירך (ס"מ)</label><input type="number" step="0.1" id="me-thigh" inputmode="decimal" /></div>
        <div class="input-field"><label>היקף ישבן (ס"מ)</label><input type="number" step="0.1" id="me-seat" inputmode="decimal" /></div>
        <div class="input-field"><label>% שומן מוערך</label><input type="number" step="0.1" id="me-fatpct" inputmode="decimal" /></div>
        <div class="input-field"><label>מ"מ 3 קפלים בגב</label><input type="number" step="0.1" id="me-fold3" inputmode="decimal" /></div>
        <div class="input-field"><label>מ"מ 2 קפל בטן</label><input type="number" step="0.1" id="me-fold2" inputmode="decimal" /></div>
        <div class="input-field"><label>מ"מ 1 קפל חזה/יד</label><input type="number" step="0.1" id="me-fold1" inputmode="decimal" /></div>
      </div>
      <button class="btn btn-gold" id="me-save-btn" style="margin-top:6px">💾 שמור מדידה</button>
    </div>

    <div class="card">
      <h3>📊 היסטוריית מדידות</h3>
      <div id="measure-history"></div>
    </div>
  </div>

</div>

<!-- ═══════════ HISTORY DETAIL MODAL ═══════════ -->
<div class="modal-overlay" id="detail-overlay">
  <div class="modal-box" id="detail-body"></div>
</div>

<div id="toast"></div>

<script src="food-db.js"></script>
<script>
// ═══════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════
const K_DAYS = 'mass_days_v1';
const K_WEIGHINS = 'mass_weighins_v1';
const K_MEASURES = 'mass_measures_v1';

function loadJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; }
}
function saveJSON(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

let days = loadJSON(K_DAYS, {});           // { "DD/MM/YYYY": {method, planned:{meal:{cats}}, actual:{meal:{cats}}, fixedNotes} }
let weighins = loadJSON(K_WEIGHINS, []);   // [{date, weight, fat, muscle, bmi, bmr, visceral, water}]
let measures = loadJSON(K_MEASURES, []);   // [{date, weight, chest, navel, arm, waist, thigh, seat, fatpct, fold3, fold2, fold1}]

let currentDate = new Date();
let currentMethod = 'portions';
let currentMode = 'planned';   // 'planned' | 'actual'
let currentMeal = 'בוקר';

const MEALS = ['בוקר', 'ביניים', 'צהריים', 'אחר הצהריים', 'ערב'];

function dateKey(d) { return d.toLocaleDateString('he-IL'); }
function dayName(d) { const days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת']; return days[d.getDay()]; }

function emptyMealSet() {
  const obj = {};
  MEALS.forEach(m => { obj[m] = { protein: [], carb: [], fat: [], veg: [], fruit: [], free: [], outside: [] }; });
  return obj;
}

function getDayEntry(key) {
  if (!days[key]) {
    days[key] = { method: 'portions', planned: emptyMealSet(), actual: emptyMealSet(), fixedNotes: '' };
  }
  // migrate old format if needed
  if (!days[key].planned) days[key].planned = emptyMealSet();
  if (!days[key].actual) days[key].actual = emptyMealSet();
  MEALS.forEach(m => {
    if (!days[key].planned[m]) days[key].planned[m] = { protein: [], carb: [], fat: [], veg: [], fruit: [], free: [], outside: [] };
    if (!days[key].actual[m]) days[key].actual[m] = { protein: [], carb: [], fat: [], veg: [], fruit: [], free: [], outside: [] };
  });
  return days[key];
}

function getMealData(entry, mode, meal) {
  return entry[mode][meal];
}

// Sum a category across ALL meals for a given mode
function sumCategory(entry, mode, cat) {
  let total = [];
  MEALS.forEach(m => { total = total.concat(entry[mode][m][cat] || []); });
  return total;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// HEADER DATE

function updateHeaderDate() {
  const now = new Date();
  document.getElementById('today-label').textContent = `יום ${dayName(now)}, ${dateKey(now)}`;
}

// ═══════════════════════════════════════════
// MENU DATE NAV
// ═══════════════════════════════════════════
function updateMenuDateLabel() {
  const today = new Date(); today.setHours(0,0,0,0);
  const cur = new Date(currentDate); cur.setHours(0,0,0,0);
  const diffDays = Math.round((cur - today) / 86400000);
  let lbl = dateKey(currentDate);
  let sub = `יום ${dayName(currentDate)}`;
  if (diffDays === 0) sub = 'היום • ' + sub;
  else if (diffDays === 1) sub = 'מחר • ' + sub;
  else if (diffDays === -1) sub = 'אתמול • ' + sub;
  document.getElementById('menu-date-lbl').innerHTML = `${lbl}<small>${sub}</small>`;
}

document.getElementById('menu-prev').addEventListener('click', () => {
  currentDate.setDate(currentDate.getDate() - 1);
  loadCurrentDay();
});
document.getElementById('menu-next').addEventListener('click', () => {
  currentDate.setDate(currentDate.getDate() + 1);
  loadCurrentDay();
});
document.getElementById('menu-today-btn').addEventListener('click', () => {
  currentDate = new Date();
  loadCurrentDay();
});

// ═══════════════════════════════════════════
// RENDER TARGETS ROW
// ═══════════════════════════════════════════
function renderTargets(entry) {
  const row = document.getElementById('targets-row');
  const cats = ['protein','carb','fat'];
  row.innerHTML = cats.map(cat => {
    const count = sumCategory(entry, currentMode, cat).reduce((s,i) => s + (i.qty||1), 0);
    const target = FOOD_DB[cat].target;
    const done = count >= target;
    return `<div class="target-box ${done?'done':''}">
      <div class="tv" style="color:${FOOD_DB[cat].color}">${count}/${target}</div>
      <div class="tl">${FOOD_DB[cat].icon} ${FOOD_DB[cat].label}</div>
    </div>`;
  }).join('');
  const vegCount = sumCategory(entry, currentMode, 'veg').length;
  row.innerHTML += `<div class="target-box ${vegCount>=5?'done':''}">
    <div class="tv" style="color:#5f9c7a">${vegCount}</div>
    <div class="tl">🥦 ירקות</div>
  </div>`;
}

// ═══════════════════════════════════════════
// MEAL TABS
// ═══════════════════════════════════════════
function renderMealTabs(entry) {
  const container = document.getElementById('meal-tabs');
  container.innerHTML = MEALS.map(m => {
    const mealData = entry[currentMode][m];
    const itemCount = Object.values(mealData).reduce((s, arr) => s + arr.reduce((ss,i)=>ss+(i.qty||1),0), 0);
    return `<button class="meal-tab ${m===currentMeal?'active':''}" onclick="selectMeal('${m}')">
      ${m}${itemCount ? `<span class="mt-count">${itemCount}</span>` : ''}
    </button>`;
  }).join('');
}

function selectMeal(meal) {
  currentMeal = meal;
  const entry = getDayEntry(dateKey(currentDate));
  renderMealTabs(entry);
  renderCategories(entry);
}

// ═══════════════════════════════════════════
// RENDER CATEGORY SECTIONS (protein/carb/fat/veg/fruit/free) — for current mode+meal
// ═══════════════════════════════════════════
const CATS_ORDER = ['protein','carb','fat','veg','fruit','free','outside'];

function renderCategories(entry) {
  const container = document.getElementById('categories-container');
  const mealData = entry[currentMode][currentMeal];
  container.innerHTML = CATS_ORDER.map(catKey => {
    let def;
    if (catKey === 'veg') def = { label: 'ירקות', icon: '🥦', color: '#5f9c7a' };
    else def = FOOD_DB[catKey];
    const arr = mealData[catKey] || [];
    const selCount = (catKey==='protein'||catKey==='carb'||catKey==='fat') ? arr.reduce((s,i)=>s+(i.qty||1),0) : arr.length;
    return `
    <div class="cat-section">
      <div class="cat-head" onclick="toggleCat('${catKey}')">
        <div class="ch-left">
          <div class="cat-icon" style="background:${def.color}22;color:${def.color}">${def.icon}</div>
          <div class="cat-name">${def.label}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="cat-count">${selCount > 0 ? selCount + ' נבחרו' : ''}</span>
          <span class="cat-arrow" id="arrow-${catKey}">›</span>
        </div>
      </div>
      <div class="cat-body" id="body-${catKey}">
        ${renderCatItems(catKey, mealData)}
      </div>
    </div>`;
  }).join('');
}

function renderCatItems(catKey, mealData) {
  if (catKey === 'veg') {
    const list = mealData.veg || [];
    let html = `<div style="display:flex;gap:8px;margin-bottom:10px">
      <input type="text" id="veg-input" placeholder="הוסף ירק..." style="flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text);font-size:13px;font-family:Heebo,sans-serif;outline:none;direction:rtl" />
      <button onclick="addVeg()" style="padding:0 16px;border-radius:10px;border:none;background:var(--gold);color:#1a1710;font-size:13px;cursor:pointer;font-weight:700">הוסף</button>
    </div>`;
    if (list.length) {
      html += list.map((v,i) => `<div class="food-item"><div class="food-name">${v.name}</div><button onclick="removeVeg(${i})" style="background:none;border:none;color:#c1666b;font-size:16px;cursor:pointer">✕</button></div>`).join('');
    } else {
      html += `<div style="text-align:center;color:var(--text2);font-size:12px;padding:10px">אין ירקות עדיין בארוחה זו</div>`;
    }
    return html;
  }

  if (catKey === 'fruit' || catKey === 'free' || catKey === 'outside') {
    const items = FOOD_DB[catKey].items;
    const selected = mealData[catKey] || [];
    return items.map(it => {
      const name = typeof it === 'string' ? it : it.name;
      const note = typeof it === 'object' ? it.note : null;
      const isSelected = selected.some(s => s.name === name);
      return `<div class="food-item">
        <div>
          <div class="food-name">${name}</div>
          ${note ? `<div style="font-size:10.5px;color:var(--text2);margin-top:2px">${note}</div>` : ''}
        </div>
        <button class="qty-btn" style="${isSelected?'background:var(--gold);color:#1a1710;border-color:var(--gold)':''}" onclick="toggleSimple('${catKey}','${name.replace(/'/g,"\\'")}')">${isSelected?'✓':'+'}</button>
      </div>`;
    }).join('');
  }

  // protein / carb / fat — quantity based
  const items = FOOD_DB[catKey].items;
  const selected = mealData[catKey] || [];
  let html = items.map(it => {
    const sel = selected.find(s => s.name === it.name);
    const qty = sel ? sel.qty : 0;
    return `<div class="food-item">
      <div class="food-name">${it.name}</div>
      <div class="fi-controls">
        <button class="qty-btn" onclick="changeQty('${catKey}','${it.name.replace(/'/g,"\\'")}',-1)">−</button>
        <span class="qty-val">${qty}</span>
        <button class="qty-btn" onclick="changeQty('${catKey}','${it.name.replace(/'/g,"\\'")}',1)">+</button>
      </div>
    </div>`;
  }).join('');

  if (catKey === 'protein' && FOOD_DB.protein.halfPlusFat) {
    html += `<div class="section-label">חלבון + חצי שומן</div>`;
    html += FOOD_DB.protein.halfPlusFat.map(it => {
      const sel = selected.find(s => s.name === it.name);
      const qty = sel ? sel.qty : 0;
      return `<div class="food-item">
        <div><div class="food-name">${it.name}</div><div style="font-size:10.5px;color:var(--text2)">${it.note}</div></div>
        <div class="fi-controls">
          <button class="qty-btn" onclick="changeQty('protein','${it.name.replace(/'/g,"\\'")}',-1)">−</button>
          <span class="qty-val">${qty}</span>
          <button class="qty-btn" onclick="changeQty('protein','${it.name.replace(/'/g,"\\'")}',1)">+</button>
        </div>
      </div>`;
    }).join('');
  }

  if (catKey === 'carb') {
    if (FOOD_DB.carb.soups) {
      html += `<div class="section-label">מרקים</div>`;
      html += FOOD_DB.carb.soups.map(it => {
        const sel = selected.find(s => s.name === it.name);
        const qty = sel ? sel.qty : 0;
        return `<div class="food-item"><div class="food-name">${it.name}</div>
          <div class="fi-controls">
            <button class="qty-btn" onclick="changeQty('carb','${it.name.replace(/'/g,"\\'")}',-1)">−</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" onclick="changeQty('carb','${it.name.replace(/'/g,"\\'")}',1)">+</button>
          </div></div>`;
      }).join('');
    }
    if (FOOD_DB.carb.misc) {
      html += `<div class="section-label">שונות</div>`;
      html += FOOD_DB.carb.misc.map(it => {
        const sel = selected.find(s => s.name === it.name);
        const qty = sel ? sel.qty : 0;
        return `<div class="food-item"><div class="food-name">${it.name}</div>
          <div class="fi-controls">
            <button class="qty-btn" onclick="changeQty('carb','${it.name.replace(/'/g,"\\'")}',-1)">−</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" onclick="changeQty('carb','${it.name.replace(/'/g,"\\'")}',1)">+</button>
          </div></div>`;
      }).join('');
    }
  }

  return html;
}

function toggleCat(catKey) {
  const body = document.getElementById('body-' + catKey);
  const arrow = document.getElementById('arrow-' + catKey);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  arrow.style.transform = isOpen ? '' : 'rotate(90deg)';
}

function changeQty(catKey, name, delta) {
  const entry = getDayEntry(dateKey(currentDate));
  const mealData = entry[currentMode][currentMeal];
  let arr = mealData[catKey];
  let item = arr.find(i => i.name === name);
  if (!item && delta > 0) {
    arr.push({ name, qty: 1 });
  } else if (item) {
    item.qty += delta;
    if (item.qty <= 0) arr = arr.filter(i => i.name !== name);
  }
  mealData[catKey] = arr;
  saveJSON(K_DAYS, days);
  renderTargets(entry);
  renderMealTabs(entry);
  renderCategories(entry);
  reopenCat(catKey);
  renderDaySummary(entry);
}

function toggleSimple(catKey, name) {
  const entry = getDayEntry(dateKey(currentDate));
  const mealData = entry[currentMode][currentMeal];
  let arr = mealData[catKey] || [];
  const idx = arr.findIndex(i => i.name === name);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push({ name });
  mealData[catKey] = arr;
  saveJSON(K_DAYS, days);
  renderMealTabs(entry);
  renderCategories(entry);
  reopenCat(catKey);
  renderDaySummary(entry);
}

function addVeg() {
  const input = document.getElementById('veg-input');
  const val = input.value.trim();
  if (!val) return;
  const entry = getDayEntry(dateKey(currentDate));
  const mealData = entry[currentMode][currentMeal];
  mealData.veg.push({ name: val });
  saveJSON(K_DAYS, days);
  renderTargets(entry);
  renderMealTabs(entry);
  renderCategories(entry);
  reopenCat('veg');
  renderDaySummary(entry);
}

function removeVeg(idx) {
  const entry = getDayEntry(dateKey(currentDate));
  const mealData = entry[currentMode][currentMeal];
  mealData.veg.splice(idx, 1);
  saveJSON(K_DAYS, days);
  renderTargets(entry);
  renderMealTabs(entry);
  renderCategories(entry);
  reopenCat('veg');
  renderDaySummary(entry);
}

function reopenCat(catKey) {
  const body = document.getElementById('body-' + catKey);
  const arrow = document.getElementById('arrow-' + catKey);
  if (body) { body.classList.add('open'); arrow.style.transform = 'rotate(90deg)'; }
}

// ═══════════════════════════════════════════
// DAY SUMMARY (both planned + actual, all meals)
// ═══════════════════════════════════════════
function buildMealRows(entry, mode) {
  const rows = [];
  MEALS.forEach(meal => {
    const md = entry[mode][meal];
    const items = [];
    ['protein','carb','fat'].forEach(cat => {
      (md[cat]||[]).forEach(it => items.push(`${FOOD_DB[cat].icon} ${it.name}${it.qty>1?' ×'+it.qty:''}`));
    });
    (md.veg||[]).forEach(it => items.push(`🥦 ${it.name}`));
    (md.fruit||[]).forEach(it => items.push(`🍎 ${it.name}`));
    (md.free||[]).forEach(it => items.push(`🍬 ${it.name}`));
    (md.outside||[]).forEach(it => items.push(`🍽️ ${it.name}`));
    if (items.length) rows.push({ meal, items });
  });
  return rows;
}

function renderDaySummary(entry) {
  document.getElementById('day-summary-title').textContent = currentMode === 'planned' ? '📋 סיכום היום — מתוכנן' : '📋 סיכום היום — בפועל';
  const body = document.getElementById('day-summary-body');

  if (currentMethod === 'fixed') {
    body.innerHTML = `<div style="font-size:12px;color:var(--text2);text-align:center;padding:8px">משתמש בתפריט הקבוע של קארין</div>`;
    return;
  }

  const rows = buildMealRows(entry, currentMode);
  if (rows.length === 0) {
    body.innerHTML = `<div style="font-size:12px;color:var(--text2);text-align:center;padding:10px">עדיין לא נבחר כלום</div>`;
    return;
  }
  body.innerHTML = rows.map(r => `
    <div style="margin-bottom:10px">
      <div style="font-size:12px;font-weight:700;color:var(--gold-soft);margin-bottom:5px">${r.meal}</div>
      ${r.items.map(i => `<div style="font-size:12.5px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04)">${i}</div>`).join('')}
    </div>`).join('');
}

// FIXED MENU RENDER

function renderFixedMenu() {
  const container = document.getElementById('fixed-menu-container');

    <div class="meal-block">

// ═══════════════════════════════════════════
// LOAD CURRENT DAY INTO UI
// ═══════════════════════════════════════════
function loadCurrentDay() {
  updateMenuDateLabel();
  const key = dateKey(currentDate);
  const entry = getDayEntry(key);

  currentMethod = entry.method || 'portions';
  currentMode = 'planned';
  currentMeal = 'בוקר';
  document.querySelectorAll('.method-btn').forEach(b => b.classList.toggle('active', b.dataset.method === currentMethod));
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === 'planned'));
  document.getElementById('portions-panel').style.display = currentMethod === 'portions' ? 'block' : 'none';
  document.getElementById('fixed-panel').style.display = currentMethod === 'fixed' ? 'block' : 'none';
  document.getElementById('mode-switch').style.display = currentMethod === 'portions' ? 'flex' : 'none';

  renderMealTabs(entry);
  renderTargets(entry);
  renderCategories(entry);
  renderFixedMenu();
  renderDaySummary(entry);
}

document.getElementById('save-day-btn').addEventListener('click', () => {
  const key = dateKey(currentDate);
  const entry = getDayEntry(key);
  entry.method = currentMethod;
  saveJSON(K_DAYS, days);
  showToast('✅ היום נשמר!');
});

document.getElementById('clear-day-btn').addEventListener('click', () => {
  if (!confirm(`לנקות את הבחירות של "${currentMeal}" (${currentMode === 'planned' ? 'מתוכנן' : 'בפועל'})?`)) return;
  const key = dateKey(currentDate);
  const entry = getDayEntry(key);
  entry[currentMode][currentMeal] = { protein: [], carb: [], fat: [], veg: [], fruit: [], free: [], outside: [] };
  saveJSON(K_DAYS, days);
  renderMealTabs(entry);
  renderTargets(entry);
  renderCategories(entry);
  renderDaySummary(entry);
  showToast('🗑 נוקה');
});

// ═══════════════════════════════════════════
// HISTORY VIEW
// ═══════════════════════════════════════════
function summarizeDay(entry, mode) {
  const p = sumCategory(entry, mode, 'protein').reduce((s,i)=>s+(i.qty||1),0);
  const c = sumCategory(entry, mode, 'carb').reduce((s,i)=>s+(i.qty||1),0);
  const f = sumCategory(entry, mode, 'fat').reduce((s,i)=>s+(i.qty||1),0);
  return `חלבון ${p}/6 • פחמימה ${c}/4 • שומן ${f}/3`;
}

function dayHasData(entry, mode) {
  return MEALS.some(m => {
    const md = entry[mode][m];
    return md.protein.length || md.carb.length || md.fat.length || md.veg.length || md.fruit.length || md.free.length || md.outside.length;
  });
}

function renderHistory() {
  const container = document.getElementById('history-list');
  const keys = Object.keys(days).filter(k => {
    const e = days[k];
    return e.method === 'fixed' || dayHasData(e, 'planned') || dayHasData(e, 'actual');
  });

  if (keys.length === 0) {
    container.innerHTML = `<div class="empty"><div class="em-icon">📋</div><div class="em-text">עוד אין ימים מתועדים<br>התחל לבנות תפריט בטאב "תפריט יומי"</div></div>`;
    return;
  }

  keys.sort((a,b) => parseDate(b) - parseDate(a));

  container.innerHTML = keys.map(k => {
    const e = days[k];
    const hasPlanned = e.method === 'fixed' || dayHasData(e, 'planned');
    const hasActual = dayHasData(e, 'actual');
    let statusHtml = '';
    if (hasPlanned && hasActual) statusHtml = `<span class="status-chip match">מתוכנן ✓ בפועל ✓</span>`;
    else if (hasPlanned) statusHtml = `<span class="status-chip pending">מתוכנן בלבד</span>`;
    else if (hasActual) statusHtml = `<span class="status-chip pending">בפועל בלבד</span>`;

    return `<div class="hist-item" onclick="showDayDetail('${k}')">
      <div class="hi-top">
        <div class="hi-date">${k}</div>
        <div class="hi-badge">${e.method === 'fixed' ? 'תפריט קבוע' : 'לפי מנות'}</div>
      </div>
      <div class="hi-summary">${e.method === 'fixed' ? 'תפריט קבוע של קארין' : summarizeDay(e, 'planned')}</div>
      <div class="hi-status">${statusHtml}</div>
    </div>`;
  }).join('');
}

function parseDate(str) {
  const parts = str.split('/');
  return new Date(parts[2], parts[1]-1, parts[0]);
}

function renderModeMeals(entry, mode) {
  if (entry.method === 'fixed' && mode === 'planned') {
    return FIXED_MENU.map(m => `<div class="meal-block"><h4>${m.name}</h4><ul>${m.parts.map(p=>`<li>${p}</li>`).join('')}</ul></div>`).join('');
  }
  const rows = buildMealRows(entry, mode);
  if (rows.length === 0) {
    return `<div class="empty" style="padding:20px"><div class="em-text">לא נבחר כלום עבור ${mode === 'planned' ? 'התכנון' : 'בפועל'}</div></div>`;
  }
  return `<div class="card">
    ${rows.map(r => `
      <div style="margin-bottom:10px">
        <div style="font-size:12px;font-weight:700;color:var(--gold-soft);margin-bottom:5px">${r.meal}</div>
        ${r.items.map(i => `<div style="font-size:12.5px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04)">${i}</div>`).join('')}
      </div>`).join('')}
    <div style="margin-top:6px;font-size:11.5px;color:var(--text2)">${summarizeDay(entry, mode)}</div>
  </div>`;
}

function showDayDetail(key) {
  const e = days[key];
  const body = document.getElementById('detail-body');

  body.innerHTML = `
    <h3>📅 ${key}</h3>
    <div class="section-label">📝 מתוכנן</div>
    ${renderModeMeals(e, 'planned')}
    <div class="section-label">✅ בפועל</div>
    ${renderModeMeals(e, 'actual')}
    <button class="btn btn-outline" onclick="document.getElementById('detail-overlay').classList.remove('show')">סגור</button>
  `;
  document.getElementById('detail-overlay').classList.add('show');
}

// ═══════════════════════════════════════════
// WEIGH-IN
// ═══════════════════════════════════════════
document.getElementById('wi-save-btn').addEventListener('click', () => {
  const weight = parseFloat(document.getElementById('wi-weight').value);
  if (!weight || weight < 30 || weight > 300) { alert('הכנס משקל תקין'); return; }

  const entry = {
    date: new Date().toISOString(),
    weight,
    fat: parseFloat(document.getElementById('wi-fat').value) || null,
    muscle: parseFloat(document.getElementById('wi-muscle').value) || null,
    bmi: parseFloat(document.getElementById('wi-bmi').value) || null,
    bmr: parseFloat(document.getElementById('wi-bmr').value) || null,
    visceral: parseFloat(document.getElementById('wi-visceral').value) || null,
    water: parseFloat(document.getElementById('wi-water').value) || null,
  };
  weighins.push(entry);
  saveJSON(K_WEIGHINS, weighins);

  ['wi-weight','wi-fat','wi-muscle','wi-bmi','wi-bmr','wi-visceral','wi-water'].forEach(id => document.getElementById(id).value = '');
  renderWeighinHistory();
  showToast('✅ שקילה נשמרה!');
});

function renderWeighinHistory() {
  const container = document.getElementById('weighin-history');
  if (weighins.length === 0) {
    container.innerHTML = `<div class="empty"><div class="em-icon">⚖️</div><div class="em-text">עוד אין שקילות</div></div>`;
    return;
  }
  const LABELS = { fat:'% שומן', muscle:'שריר', bmi:'BMI', bmr:'BMR', visceral:'שומן קרביים', water:'% מים' };
  const sorted = [...weighins].reverse();
  container.innerHTML = sorted.map((w, i) => {
    const prev = sorted[i+1];
    let deltaHtml = '';
    if (prev) {
      const d = (w.weight - prev.weight).toFixed(1);
      const cls = d > 0 ? 'delta-up' : d < 0 ? 'delta-down' : '';
      const arrow = d > 0 ? '↑' : d < 0 ? '↓' : '→';
      deltaHtml = `<div class="wi-delta ${cls}">${arrow} ${Math.abs(d)} ק"ג</div>`;
    }
    const idx = sorted.length - 1 - i;
    const fields = Object.entries(LABELS).filter(([k]) => w[k] != null)
      .map(([k,l]) => `<div class="wi-row"><span>${l}</span><span>${w[k]}</span></div>`).join('');
    return `<div class="wi-item">
      <div class="wi-head" onclick="toggleWi(${idx})">
        <div><div class="wi-date">${new Date(w.date).toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'})}</div></div>
        <div style="text-align:left"><div class="wi-weight">${w.weight} ק"ג</div>${deltaHtml}</div>
      </div>
      <div class="wi-body" id="wi-body-${idx}">${fields || '<div style="color:var(--text2);font-size:12px;padding:8px 0">אין נתונים נוספים</div>'}</div>
    </div>`;
  }).join('');
}

function toggleWi(idx) {
  document.getElementById('wi-body-'+idx).classList.toggle('open');
}

// ═══════════════════════════════════════════
// MEASUREMENTS (monthly, from Karin meetings)
// ═══════════════════════════════════════════
document.getElementById('me-save-btn').addEventListener('click', () => {
  const dateVal = document.getElementById('me-date').value;
  const dateStr = dateVal ? new Date(dateVal).toLocaleDateString('he-IL') : new Date().toLocaleDateString('he-IL');

  const fields = ['weight','chest','navel','arm','waist','thigh','seat','fatpct','fold3','fold2','fold1'];
  const entry = { date: dateStr };
  let has = false;
  fields.forEach(f => {
    const v = parseFloat(document.getElementById('me-'+f).value);
    if (v) { entry[f] = v; has = true; }
  });
  if (!has) { alert('הכנס לפחות מדד אחד'); return; }

  measures.push(entry);
  saveJSON(K_MEASURES, measures);
  fields.forEach(f => document.getElementById('me-'+f).value = '');
  document.getElementById('me-date').value = '';
  renderMeasureHistory();
  showToast('✅ מדידה נשמרה!');
});

function renderMeasureHistory() {
  const container = document.getElementById('measure-history');
  if (measures.length === 0) {
    container.innerHTML = `<div class="empty"><div class="em-icon">📏</div><div class="em-text">עוד אין מדידות<br>הוסף את הנתונים מהפגישה הראשונה עם קארין</div></div>`;
    return;
  }
  const LABELS = { weight:'משקל (ק"ג)', chest:'חזה/יד', navel:'טבור', arm:'יד', waist:'מותניים', thigh:'ירך', seat:'ישבן', fatpct:'% שומן', fold3:'קפל גב', fold2:'קפל בטן', fold1:'קפל חזה' };
  const sorted = [...measures].reverse();
  container.innerHTML = sorted.map((m, i) => {
    const fields = Object.entries(LABELS).filter(([k]) => m[k] != null)
      .map(([k,l]) => `<div class="wi-row"><span>${l}</span><span>${m[k]}${k!=='weight'&&k!=='fatpct'?' ס"מ':(k==='fatpct'?'%':'')}</span></div>`).join('');
    return `<div class="wi-item">
      <div class="wi-head" onclick="toggleMe(${i})">
        <div class="wi-date">${m.date}</div>
        <div style="font-size:13px;color:var(--gold-soft)">›</div>
      </div>
      <div class="wi-body" id="me-body-${i}">${fields}</div>
    </div>`;
  }).join('');
}

function toggleMe(idx) {
  document.getElementById('me-body-'+idx).classList.toggle('open');
}
